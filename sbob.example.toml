# Copia in ~/.config/sbob/sbob.toml (o ./sbob.toml, o $SBOB_CONFIG) e metti le chiavi in .env accanto.

root = "~/Università"                         # le cartelle relative dei corsi partono da qui
lingua = "it"

[audio]
bitrate = "32k"

[download]
formato = "video"            # "audio" = solo la voce (mp3 di Webex, molto più leggero), direttamente in audio/
                             # si può mettere anche per un singolo corso: formato = "audio" in [corsi.<slug>]

# ---------------------------------------------------------------- modelli per ruolo
# I default sono già pronti (vedi DEFAULT_MODELLI in config.py): ogni ruolo usa un modello Gemini diverso, perché
# ogni modello ha la sua quota giornaliera. Il più nuovo (3.8 Flash) fa gli appunti, il lavoro più difficile:
#   trascrizione  gemini-3-flash-preview   (riserva 3.5 Flash-Lite)
#   notes         gemini-3.8-flash         (riserva 3.7 Flash)
#   refiner       gemini-3.5-flash-lite    (riserva 3.1 Flash-Lite)
#   pdf           gemini-3.6-flash         (riserva 3.5 Flash)
#   pdf_testo     gemini-3.1-flash-lite    (solo testo, quando finisce la quota a visione)
#   mappa         gemini-3.1-flash-lite    (riserva 3.5 Flash-Lite)
# Qui si cambia solo ciò che serve. Si può sovrascrivere anche da CLI (es. `sbob appunti elettronica --notes anthropic:claude-sonnet-5-5`).
# prezzi in USD per milione di token (facoltativi: servono solo per il riepilogo costi).

# [modelli.notes]
# provider = "deepseek"                      # esempio: appunti con DeepSeek (a pagamento, nessun limite giornaliero)
# model = "deepseek-v4-pro"
# rpm = 200
# thinking = false
# riserva = { provider = "gemini", model = "gemini-3.8-flash", rpm = 10 }
# prezzi = { input = 0.0, output = 0.0 }

# Alternativa per leggere i PDF con Qwen (visione) — verifica nome modello e endpoint sul tuo account DashScope:
# [modelli.pdf]
# provider = "qwen"
# model = "qwen-vl-max"
# pdf_modo = "immagini"          # pagine come PNG (automatico per i provider OpenAI-compatibili)
# NB: l'API DeepSeek è solo testo: non può leggere PDF.

# ---------------------------------------------------------------- materiale
[materiale]
converti = true              # false = scarica e basta (si converte a mano con `sbob materiale <corso> --converti`)
se_finisce_quota = "testo"   # "testo" = prosegue con un modello solo-testo e avvisa; "ferma" = si ferma e riprende dopo
# File da siti disordinati: scaricali a mano in <corso>/materiale/<cartella a scelta>/, sbob li tratta come gli altri.

# ---------------------------------------------------------------- taccuino NotebookLM
# Un taccuino per corso con appunti e materiale, sempre aggiornato (richiede `notebooklm login`, vedi `sbob doctor`).
[notebook]
attivo = false               # true = `sbob run` e `sbob aggiorna` aggiornano anche il taccuino; `sbob notebook <corso>` lo fa a richiesta
max_sorgenti = 50            # oltre questo numero di sorgenti sbob avvisa e non ne aggiunge

# ---------------------------------------------------------------- provider
# I default (gemini, deepseek, openai, anthropic) sono già definiti; qui si aggiungono o modificano.
# chiavi = prefisso env: legge PREFISSO_ACCOUNT1..N e PREFISSO.
# [providers.qwen]
# tipo = "openai"
# base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
# chiavi = "DASHSCOPE_API_KEY"
#
# [providers.openrouter]
# tipo = "openai"
# base_url = "https://openrouter.ai/api/v1"
# chiavi = "OPENROUTER_API_KEY"

# ---------------------------------------------------------------- corsi
[corsi.elettronica]
nome = "Elettronica"
anno_accademico = "2025-26"
cartella = "3 anno /1 semestre/elettronica"     # relativa a root (attenzione agli spazi finali)
sorgente = { tipo = "txt", file = "link.txt" }  # file relativo alla cartella del corso
trascrizione = "gemini"                         # gemini | notebooklm
notebook = "Sbobine Elettronica"                # solo per trascrizione = notebooklm
inizio_corso = "2025-09-15"

# [corsi.real_analysis]
