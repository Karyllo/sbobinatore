[project]
name = "sbobinatore"
version = "0.1.0"
description = "Pipeline unica per le lezioni: registrazioni → audio → trascrizioni → appunti"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "questionary>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
whisper = ["mlx-whisper>=0.4"]   # backend non mantenuto, per chi forka
pdf = ["pymupdf>=1.24", "pillow>=10"]
office = ["markitdown>=0.1"]    # .pptx/.docx senza LibreOffice (solo testo)
html = ["markdownify>=0.13"]
login = ["playwright>=1.45"]   # sbob login: accesso di Ateneo nel Chrome di sistema, senza incollare cookie
base = ["sbobinatore[gemini,login]"]          # quello che serve a chi usa solo Gemini: la scelta predefinita
all = ["sbobinatore[gemini,openai,anthropic,pdf,html,login]"]

[project.scripts]
sbob = "sbob.cli:main"

[dependency-groups]
dev = ["pytest>=8", "google-genai>=1.0", "openai>=1.40", "anthropic>=0.40", "markdownify>=0.13",
       "pymupdf>=1.24", "pillow>=10", "playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbob"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
# la skill per Claude Code viaggia nel pacchetto: `sbob installa-skill` la copia in ~/.claude/skills
"skills/sbobinatore" = "sbob/skill"
